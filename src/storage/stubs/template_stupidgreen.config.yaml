server:
  address: "127.0.0.1"
  port: 8000
  threads: 1
  unix: false
mode: "blog"
theme: "default"
metadata:
  title: "StupidGreen Blog"
  description: "A static blog built with StupidGreen"
  # Your public web address: bare domains, subdomains and subpaths all work
  # (`website.com`, `sub.website.com`, `website.com/docs`). The scheme
  # defaults to https. Used for absolute asset/feed/sitemap links.
  url: "https://example.com"
  author: "George Lemon"
  keywords: ["blog", "stupidgreen"]
appearance:
  show_theme_switcher: true
  default_theme: "system"
  container_width: "col-lg-10 mx-auto"
  content_width: "col-lg-8"
  background_noise_opacity: 0.03
header:
  search:
    enable: true
    index_meta_data: true
    index_page_titles: true
content:
  allowedRawHtmlTags:
    - "b"
    - "i"
    - "strong"
    - "em"
    - "a"
    - "p"
    - "ul"
    - "ol"
    - "li"
  showReadingTime: true
  showLastUpdated: true
  lastDateUpdatedFormat: "yyyy-MM-dd HH:mm:ss"
  enableAutoFormatLinks: true
  bottom_navigation: true
  code_line_numbers: false
  highlight_strip_lines: true
  excerpt_length: 160
  readMoreText: "Continue reading this story"
  lazyloadIframes: false
  lazyloadVideos: false
  lazyloadImages: false
  slugFromTitle: false
  postReferences: true
pagination:
  per_page: 10
assets:
  # Static asset pipeline (Squeezy). On `build` (and at startup on `run`)
  # the stylesheets below are merged in order into `assets/bundle.css`
  # and each script is bundled independently, in place (minified).
  # Listed files come first, in order; any other `*.css`/`*.js` found in
  # `assets/` is picked up automatically (vendored `*.min.css` inlined
  # raw and first for the cascade, `*.min.js` left alone unless listed).
  # Only `bundle: false` disables the pipeline. Any failure (a listed
  # file missing, a parse error) fails the command.
  bundle: true
  css: ["bootstrap.min.css", "style.css", "sweetsyntax.css", "print.css"]
  js: ["app.js"]
feed:
  enable: true
  limit: 20
  kind: "rss"
activitypub:
  enable: false
  username: "blog"
  name: "StupidGreen Blog"
  summary: "Posts from a StupidGreen blog, federated over ActivityPub."
  icon: "/cache/stupidgreen.png"
languages:
  # Multilingual support (opt-in). When `enable` is true, translated files
  # use a lang suffix (`posts/hello-world.ro.md`, `pages/about.ro.md`);
  # the default language keeps bare names and unprefixed URLs, other
  # languages live under `/<lang>/...` (e.g. `/ro/about`).
  enable: false
  default: "en"
  supported: ["en"]
navbar:
  - title: "Home"
    url: "/"
  - title: "About"
    url: "/about"
footer:
  text: "Made by Humans from OpenPeeps"
  links:
    - title: "GitHub"
      url: "https://github.com/example"
